<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/bold/style.css">
    <link rel="stylesheet" href="style.css">
    <title>Recipe Explorer</title>
</head>

<body>
    <div class="container">

        <header class="header">
            <div class="logo">
                <div class="icon">
                    <i class="ph ph-chef-hat"></i>
                </div>
                <h1>Recipe Explorer</h1>
            </div>
            <div class="search-bar">
                <i class="ph-bold ph-magnifying-glass"></i>
                <input type="text" placeholder="Search recipes..." class="search-input">
            </div>
        </header>

        <main>

            <div class="side-bar">
                <h2 class="side-bar-title">Recipes</h2>

                <div class="empty-state">
                    <div class="empty-icon">
                        <i class="ph ph-magnifying-glass"></i>
                    </div>
                    <h3>No Recipes Found</h3>
                    <p>No recipes match your search criteria. Try searching with a different keyword.</p>
                </div>

                <div class="recipes-container">
                </div>

            </div>

            <div class="detailed-recipe">

                <div class="empty-state">
                    <div class="empty-icon">
                        <i class="ph ph-hand-pointing"></i>
                    </div>
                    <h2>No Recipe Selected</h2>
                    <p>Select a recipe from the sidebar menu to view its complete details, read the ingredients, and see
                        the instructions.</p>
                </div>

                <div class="detailed-recipe-container">
                </div>

            </div>


        </main>


    </div>

    <script type="module" src="script.js"></script>
</body>

</html>
